# golangci-lint v2 configuration: BASELINE
# Copy to the module root as .golangci.yml, then check it with:
#   golangci-lint config verify
#
# Requires golangci-lint v2 (validated against v2.14.0). A v1 binary cannot
# read this file; run `golangci-lint migrate` on any repo still pinning v1.
#
# Baseline = the v2 `standard` linter set (errcheck, govet, ineffassign,
# staticcheck, unused), a low-friction default most codebases pass with few
# changes, plus gofmt/goimports formatting checks.
# For the opt-in strict profile, use .golangci.strict.yml instead.

version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard

  settings:
    errcheck:
      # Add repo-specific closers here only when the std-error-handling preset
      # below does not already cover them, e.g.:
      # exclude-functions:
      #   - (*database/sql.Rows).Close
      exclude-functions: []

  exclusions:
    # Skip generated files (header "Code generated ... DO NOT EDIT." and similar)
    generated: lax
    # Report exclusion rules that no longer match anything
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax

issues:
  # Report every issue (the defaults cap them at 50 per linter and 3 identical)
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
  sort-order:
    - linter
    - file

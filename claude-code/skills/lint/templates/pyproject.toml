# Python lint + type-check configuration (Ruff + mypy)
# Recommended standard for new Python work.
# Merge these tables into the project's pyproject.toml.
# pytest and coverage settings belong in the project's own test configuration.

[tool.ruff]
target-version = "py312"   # set to the project's minimum supported Python
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TC",    # flake8-type-checking
    "S",     # flake8-bandit (security)
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",  # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]   # assert is how pytest tests assert
"__init__.py" = ["F401"]     # re-exports

[tool.ruff.lint.isort]
known-first-party = ["myproject"]   # replace with the package name

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"   # match tool.ruff target-version
strict = true
warn_unreachable = true
